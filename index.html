<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Tools - Educational Utilities & Calculators</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #131b2e;
            --accent-color: #3b82f6;
            --text-color: #f8fafc;
            --text-secondary: #94a3b8;
            --border-color: #1e293b;
            --hover-color: #1d283a;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 1.2rem;
            color: var(--text-color);
        }

        .logo span {
            color: var(--accent-color);
        }

        .nav-search {
            width: 300px;
            padding: 8px 14px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-color);
            color: var(--text-color);
            outline: none;
            font-size: 0.9rem;
        }

        .nav-search:focus {
            border-color: var(--accent-color);
        }

        .main-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 24px;
            flex: 1;
            width: 100%;
            box-sizing: border-box;
        }

        .category-filter {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            overflow-x: auto;
            padding-bottom: 5px;
        }

        .filter-btn {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            white-space: nowrap;
            transition: 0.2s;
        }

        .filter-btn:hover, .filter-btn.active {
            background-color: var(--accent-color);
            color: white;
            border-color: var(--accent-color);
        }

        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 16px;
        }

        .game-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
        }

        .game-card:hover {
            transform: translateY(-3px);
            border-color: var(--accent-color);
            box-shadow: 0 10px 20px -5px rgba(59, 130, 246, 0.2);
        }

        .game-thumb {
            width: 100%;
            height: 110px;
            background: linear-gradient(135deg, #1e293b, #0f172a);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
        }

        .game-details {
            padding: 12px;
        }

        .game-details h3 {
            margin: 0 0 4px;
            font-size: 0.95rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .game-details p {
            margin: 0;
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        #player-view {
            display: none;
            flex-direction: column;
            flex: 1;
            padding: 20px;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
        }

        .player-topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .back-btn {
            background-color: var(--card-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .back-btn:hover {
            background-color: var(--hover-color);
        }

        .frame-wrapper {
            position: relative;
            width: 100%;
            flex: 1;
            min-height: 650px;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        footer {
            text-align: center;
            padding: 20px;
            background-color: var(--card-bg);
            color: var(--text-secondary);
            font-size: 0.8rem;
            border-top: 1px solid var(--border-color);
            margin-top: auto;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <span>📐</span> Math Tools 
        </div>
        <input type="text" class="nav-search" id="searchBar" placeholder="Search modules & tools..." onkeyup="filterGames()">
    </header>

    <div id="menu-view" class="main-container">
        <div class="category-filter">
            <button class="filter-btn active" onclick="filterCat('all')">All Modules</button>
            <button class="filter-btn" onclick="filterCat('runner')">Motion & Physics</button>
            <button class="filter-btn" onclick="filterCat('puzzle')">Logic & Puzzles</button>
            <button class="filter-btn" onclick="filterCat('arcade')">Simulations</button>
        </div>

        <div class="game-grid" id="gameGrid"></div>
    </div>

    <div id="player-view">
        <div class="player-topbar">
            <button class="back-btn" onclick="goHome()">← Back to Calculators</button>
            <h2 id="moduleTitle" style="margin:0; font-size: 1rem; color: var(--text-secondary);">Module Active</h2>
            <div style="width: 100px;"></div>
        </div>
        <div class="frame-wrapper">
            <iframe id="gameFrame" src="" allowfullscreen></iframe>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Math Tools Enterprise. Standard educational portal framework.</p>
    </footer>

            { title: "Paper Minecraft", cat: "puzzle", icon: "⛏️", url: "https://scratch.mit.edu/projects/1012845/embed", desc: "2D terrain generation" },
            { title: "Super Mario 64 JS", cat: "runner", icon: "🍄", url: "https://robobar.github.io/sm64js/", desc: "3D rendering engine test" },
            { title: "Doom JS", cat: "arcade", icon: "🔫", url: "https://js-dos.com/games/doom.js.html", desc: "Raycasting engine sim" },
            { title: "Quake JS", cat: "arcade", icon: "💥", url: "https://quakejs.com/", desc: "Vector graphics mapping" },
            { title: "Retro Bowl Local", cat: "arcade", icon: "🏈", url: "https://retrobowl.me/", desc: "Data matrix stats" },
            { title: "Slope Unblocked", cat: "runner", icon: "⛰️", url: "https://kbhgames.com/game/slope", desc: "Angular momentum physics" }
        ];

        function renderGames(list) {
            const grid = document.getElementById('gameGrid');
            grid.innerHTML = "";
            list.forEach(g => {
                grid.innerHTML += `
                    <div class="game-card" onclick="playGame('${g.url}', '${g.title}')">
                        <div class="game-thumb">${g.icon}</div>
                        <div class="game-details">
                            <h3>${g.title}</h3>
                            <p>${g.desc}</p>
                        </div>
                    </div>
                `;
            });
        }

        function playGame(url, title) {
            document.getElementById('menu-view').style.display = 'none';
            document.getElementById('player-view').style.display = 'flex';
            document.getElementById('moduleTitle').innerText = title;
            document.getElementById('gameFrame').src = url;
        }

        function goHome() {
            document.getElementById('player-view').style.display = 'none';
            document.getElementById('menu-view').style.display = 'block';
            document.getElementById('gameFrame').src = '';
        }

        function filterGames() {
            let query = document.getElementById('searchBar').value.toLowerCase();
            let filtered = games.filter(g => g.title.toLowerCase().includes(query) || g.desc.toLowerCase().includes(query));
            renderGames(filtered);
        }

        function filterCat(cat) {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            if(cat === 'all') {
                renderGames(games);
            } else {
                renderGames(games.filter(g => g.cat === cat));
            }
        }

        renderGames(games);
    </script>
</body>
</html>
